# ==========================================
#  Devke Zendure Cool Guard – compleet thema voor wie het STANDAARDthema gebruikt
#  Bestand: config/themes/devke_cool_guard.yaml
#  Ziet eruit als standaard HA, met alleen de alarmstrook erbij.
#  Vereist: card-mod (HACS) en in configuration.yaml:
#    frontend:
#      themes: !include_dir_merge_named themes
# ==========================================

Devke Cool Guard:
  # Zorgt dat licht/donker (volgens je apparaat) gewoon blijft werken
  modes:
    light: {}
    dark: {}

  card-mod-theme: Devke Cool Guard

  # Rode knipperende alarmstrook onder de kopbalk met de alarmtekst
  card-mod-root: |
    {% if is_state('binary_sensor.coolguard_alarm', 'on') %}
    {% set m = namespace(t=[]) %}
    {% set max = states('input_number.zendure_temp_max') | float(45) %}
    {% if states('sensor.zendure_2400_ac_omvormer_temperatuur') | float(0) > max %}
      {% set m.t = m.t + ['Zendure 1 te warm (' ~ states('sensor.zendure_2400_ac_omvormer_temperatuur') ~ ' °C)'] %}
    {% endif %}
    {% if states('sensor.zendure_2_omvormer_temperatuur') | float(0) > max %}
      {% set m.t = m.t + ['Zendure 2 te warm (' ~ states('sensor.zendure_2_omvormer_temperatuur') ~ ' °C)'] %}
    {% endif %}
    {% if is_state('binary_sensor.zendure_1_onderhoud_nodig', 'on') %}
      {% set m.t = m.t + ['Zendure 1 ventilator schoonmaken'] %}
    {% endif %}
    {% if is_state('binary_sensor.zendure_2_onderhoud_nodig', 'on') %}
      {% set m.t = m.t + ['Zendure 2 ventilator schoonmaken'] %}
    {% endif %}
    .header {
      flex-wrap: wrap;
    }
    .header::after {
      content: "⚠  ALARM: {{ (m.t | join('  ·  ') if m.t else 'zie Alarmen-dashboard') | replace('"', '') }}";
      display: block;
      width: 100%;
      box-sizing: border-box;
      height: 32px;
      line-height: 32px;
      padding: 0 16px;
      text-align: center;
      font-weight: 600;
      font-size: 15px;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: devke-alarm 1.5s ease-in-out infinite;
    }
    @keyframes devke-alarm {
      0%, 100% { background-color: rgba(219, 68, 55, 0.55); }
      50% { background-color: var(--error-color); }
    }
    #view {
      padding-top: calc(var(--header-height) + 32px + 20px + env(safe-area-inset-top)) !important;
    }
    {% endif %}

  # Menu-item van het alarmdashboard knippert in de zijbalk
  card-mod-sidebar: |
    {% if is_state('binary_sensor.coolguard_alarm', 'on') %}
    a[href="/dashboard-alarmen"] {
      border-radius: 8px;
      animation: devke-alarm-menu 1.5s ease-in-out infinite;
    }
    @keyframes devke-alarm-menu {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(219, 68, 55, 0.45); }
    }
    {% endif %}
